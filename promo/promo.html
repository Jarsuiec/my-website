<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Promo</title>
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;font-family:'Inter Display','Inter',sans-serif;color:#fff;background:#000}
canvas.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
#cam{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 50%}
.el{position:absolute;left:50%;top:50%;white-space:nowrap;text-align:center;transform-origin:50% 50%;will-change:transform,opacity,filter}
.w,.ch{display:inline-block;transform-origin:50% 70%;will-change:transform,opacity,filter}
.sp{width:.26em}
.f40{font-size:40px;font-weight:600}
.f56{font-size:56px;font-weight:600;letter-spacing:-.01em}
.f64{font-size:64px;font-weight:700;letter-spacing:-.015em}
.f80{font-size:80px;font-weight:800;letter-spacing:-.025em;line-height:1.05}
.f96{font-size:96px;font-weight:800;letter-spacing:-.03em;line-height:1.02}
.f120{font-size:120px;font-weight:900;letter-spacing:-.04em;line-height:1}
.f150{font-size:150px;font-weight:900;letter-spacing:-.045em;line-height:.96}
.f190{font-size:190px;font-weight:900;letter-spacing:-.05em;line-height:.92}
.f230{font-size:230px;font-weight:900;letter-spacing:-.055em;line-height:.9}
.muted{color:rgba(235,240,255,.55)}
.dim{color:rgba(235,240,255,.38)}
.red{color:#ff4d5e}
.g1,.g2,.g3,.gtg,.gai,.gw{-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .04em}
.g1{background-image:linear-gradient(100deg,#ffc27a 0%,#ff7a3d 30%,#ff3d77 62%,#a46bff 100%)}
.g2{background-image:linear-gradient(100deg,#8ff5ff 0%,#4f9dff 45%,#a77bff 100%)}
.g3{background-image:linear-gradient(100deg,#ff8a3d,#ff3d77)}
.gtg{background-image:linear-gradient(100deg,#9fe3ff 0%,#2AABEE 50%,#6b7bff 100%)}
.gw{background-image:linear-gradient(180deg,#ffffff 30%,#9fb0d0 100%)}
.gai{background-image:linear-gradient(100deg,#00e5ff,#7a5cff,#ff3df2,#00e5ff);background-size:300% 100%}
.label{font-size:34px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:rgba(235,240,255,.6)}
.pill{display:inline-flex;align-items:center;gap:22px;padding:22px 44px;border-radius:999px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);font-size:44px;font-weight:700}
.dot{width:22px;height:22px;border-radius:50%;background:#ff3d77;box-shadow:0 0 24px currentColor}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.035));border:2px solid rgba(255,255,255,.16);box-shadow:0 40px 120px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2)}
/* product card */
.card{position:relative;width:600px;padding:34px;border-radius:60px;white-space:normal;text-align:left}
.card .ph{position:relative;height:520px;border-radius:38px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .ph svg{width:340px;height:374px}
.card .t1{height:34px;width:78%;border-radius:17px;margin:34px 0 18px;background:rgba(255,255,255,.3)}
.card .t2{height:26px;width:52%;border-radius:13px;background:rgba(255,255,255,.16)}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:34px}
.card .price{font-size:64px;font-weight:800;letter-spacing:-.03em}
.card .buy{font-size:36px;font-weight:700;padding:20px 38px;border-radius:999px;background:#fff;color:#111}
.card.grey .ph{background:#2a303c}
.card.grey .buy{background:#3a4150;color:#c7cfdd}
.card.grey .price{color:#aeb7c8}
.card.vivid{background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border-color:rgba(255,200,170,.5);box-shadow:0 40px 140px rgba(255,61,119,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.card.vivid .ph{background:linear-gradient(140deg,#ffe8cc 0%,#ffb59a 55%,#ff7a95 100%)}
.card.vivid .buy{background:linear-gradient(100deg,#ff7a3d,#ff3d77);color:#fff;box-shadow:0 12px 40px rgba(255,61,119,.6)}
.card.vivid .t1{background:rgba(255,255,255,.75)}
.card.vivid .t2{background:rgba(255,255,255,.4)}
.badge{position:absolute;left:28px;top:28px;font-size:30px;font-weight:800;letter-spacing:.08em;padding:12px 24px;border-radius:999px;background:#fff;color:#ff3d77}
.check{display:flex;align-items:center;gap:30px;font-size:64px;font-weight:800;letter-spacing:-.02em}
.check i{flex:none;width:84px;height:84px;border-radius:50%;background:linear-gradient(140deg,#5ef0b0,#16b98a);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(52,211,153,.55)}
.check i svg{width:50px;height:50px}
.tile{width:440px;height:440px;border-radius:64px;display:flex;flex-direction:column;justify-content:space-between;padding:52px;box-sizing:border-box;white-space:normal;text-align:left}
.tile .ic{width:120px;height:120px;border-radius:36px;display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:74px;height:74px}
.tile b{font-size:52px;font-weight:800;letter-spacing:-.025em;line-height:1.05}
.tile small{display:block;font-size:30px;font-weight:600;color:rgba(235,240,255,.5);margin-bottom:10px;letter-spacing:.1em}
.chip{position:relative;display:inline-flex;align-items:center;gap:30px;padding:34px 70px 34px 50px;border-radius:999px;background:linear-gradient(120deg,#36b9ff,#2AABEE 45%,#1a73d9);font-size:104px;font-weight:900;letter-spacing:-.03em;box-shadow:0 30px 120px rgba(42,171,238,.6),inset 0 2px 0 rgba(255,255,255,.4);overflow:hidden}
.chip svg{width:110px;height:110px}
.chip .shine{position:absolute;top:-20%;left:0;width:30%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg)}
.strike{position:absolute;left:50%;top:50%;height:22px;border-radius:11px;background:linear-gradient(90deg,#ff3d5e,#ff7a3d);box-shadow:0 0 40px rgba(255,61,94,.8);transform-origin:0 50%}
.num{font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.lens{width:300px;height:300px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 60% at 50% 48%,transparent 55%,rgba(0,0,0,.6) 100%)}
#grain{mix-blend-mode:overlay;opacity:.32}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="full" width="1080" height="1920"></canvas>
  <div id="cam"></div>
  <canvas id="fx" class="full" width="1080" height="1920"></canvas>
  <div id="flash"></div>
  <div id="vig"></div>
  <canvas id="grain" class="full" width="540" height="960"></canvas>
</div>
<script>
(function(){
// ---------------------------------------------------------------- data
const TM = window.TIMING, S = TM.sentences;
const VEND = TM.duration, END = VEND + 3.7;
window.END = END;
const norm = s => s.toLowerCase().replace(/[^a-zа-яё0-9]/g, '');
function W(si, key, edge) {
  const ws = S[si].words; let w;
  if (typeof key === 'number') w = ws[key < 0 ? ws.length + key : key];
  else { const k = norm(key); w = ws.find(x => norm(x.w).startsWith(k)); }
  if (!w) throw new Error('word ' + si + ' ' + key);
  return w[edge || 's'];
}
const ST = i => S[i].s, EN = i => S[i].e;

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, d) => clamp((t - a) / d);
const E = {
  lin: x => x,
  out3: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in3: x => x * x * x,
  in2: x => x * x,
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  expo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const wob = i => Math.sin(i * .9) * .5 + Math.sin(i * 2.3 + 1) * .3 + Math.sin(i * 5.1 + 2) * .2;
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const mixc = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ---------------------------------------------------------------- events
const EV = [];
const ev = (type, t, k = 1, d = 0) => EV.push({ type, t, k, d });

// ---------------------------------------------------------------- clips
const cam = document.getElementById('cam');
const clips = [];
const FXI = {
  none: p => ({}),
  fade: p => ({ op: p }),
  rise: p => ({ y: (1 - p) * 120, blur: (1 - p) * 18, op: p }),
  riseBig: p => ({ y: (1 - p) * 300, rx: (1 - p) * -50, blur: (1 - p) * 26, op: p }),
  drop: p => ({ y: -(1 - p) * 150, blur: (1 - p) * 18, op: p }),
  zoom: p => ({ s: 1 + (1 - p) * 1.9, blur: (1 - p) * 40, op: Math.min(1, p * 2.4) }),
  pop: p => ({ s: .15 + .85 * p, op: Math.min(1, p * 3) }),
  left: p => ({ x: -(1 - p) * 1400, sk: (1 - p) * 28, blur: (1 - p) * 30, op: Math.min(1, p * 2) }),
  right: p => ({ x: (1 - p) * 1400, sk: -(1 - p) * 28, blur: (1 - p) * 30, op: Math.min(1, p * 2) }),
  flip: p => ({ rx: (1 - p) * -100, y: (1 - p) * 90, blur: (1 - p) * 12, op: Math.min(1, p * 1.8) }),
  flipY: p => ({ ry: (1 - p) * 110, blur: (1 - p) * 12, op: Math.min(1, p * 1.8) }),
  far: p => ({ z: -(1 - p) * 3200, blur: (1 - p) * 14, op: Math.min(1, p * 1.6) }),
  spin: p => ({ rz: (1 - p) * -30, s: .35 + .65 * p, blur: (1 - p) * 22, op: Math.min(1, p * 2) }),
  up: p => ({ y: (1 - p) * 900, rz: (1 - p) * 8, blur: (1 - p) * 30, op: Math.min(1, p * 2) }),
  down: p => ({ y: -(1 - p) * 900, rz: (1 - p) * -8, blur: (1 - p) * 30, op: Math.min(1, p * 2) }),
};
const FXO = {
  none: p => ({}),
  up: p => ({ y: -p * 170, blur: p * 20, op: 1 - p }),
  down: p => ({ y: p * 170, blur: p * 20, op: 1 - p }),
  through: p => ({ s: 1 + p * 2.8, blur: p * 32, op: 1 - p }),
  far: p => ({ z: -p * 2400, op: 1 - p, blur: p * 10 }),
  left: p => ({ x: -p * 1400, sk: p * -24, blur: p * 26, op: 1 - p * .5 }),
  right: p => ({ x: p * 1400, sk: p * 24, blur: p * 26, op: 1 - p * .5 }),
  fade: p => ({ op: 1 - p }),
  flip: p => ({ rx: p * 95, op: 1 - p, blur: p * 10 }),
  fly: p => ({ y: -p * 1300, s: 1 + p * .4, blur: p * 30, op: 1 - p * .7 }),
  sink: p => ({ y: p * 1300, blur: p * 30, op: 1 - p * .7 }),
};
const base = (x = 0, y = 0) => ({ x, y, z: 0, rx: 0, ry: 0, rz: 0, sk: 0, s: 1, op: 1, blur: 0, filt: '' });
function mix(s, a) {
  if (a.x) s.x += a.x; if (a.y) s.y += a.y; if (a.z) s.z += a.z;
  if (a.rx) s.rx += a.rx; if (a.ry) s.ry += a.ry; if (a.rz) s.rz += a.rz; if (a.sk) s.sk += a.sk;
  if (a.s !== undefined) s.s *= a.s; if (a.op !== undefined) s.op *= a.op; if (a.blur) s.blur += a.blur;
}
function write(el, s, center) {
  el.style.transform = (center ? 'translate(-50%,-50%) ' : '') +
    `translate3d(${s.x.toFixed(2)}px,${s.y.toFixed(2)}px,${s.z.toFixed(1)}px) rotateX(${s.rx.toFixed(2)}deg) rotateY(${s.ry.toFixed(2)}deg) rotateZ(${s.rz.toFixed(2)}deg) skewX(${s.sk.toFixed(2)}deg) scale(${Math.max(0, s.s).toFixed(4)})`;
  el.style.opacity = clamp(s.op).toFixed(3);
  const f = (s.blur > .3 ? `blur(${s.blur.toFixed(1)}px) ` : '') + (s.filt || '');
  el.style.filter = f || 'none';
}
function clip(o) {
  o = Object.assign({ x: 0, y: 0, inFx: 'rise', outFx: 'up', dIn: .6, dOut: .35, eIn: E.expo, eOut: E.in3, drift: .012, t1: 1e9 }, o);
  const el = document.createElement('div');
  el.className = 'el ' + (o.cls || '');
  if (o.words) {
    const parts = [];
    o.words.forEach((w, i) => { if (w === 'br') parts.push('<br>'); else parts.push(`<span class="w ${w[2] || ''}">${w[0]}</span>`); });
    el.innerHTML = parts.join(' ').replace(/ <br> /g, '<br>');
    o.wels = [...el.querySelectorAll('.w')];
    o.wdata = o.words.filter(w => w !== 'br');
  } else if (o.chars) {
    el.innerHTML = [...o.chars].map(c => c === ' ' ? '<span class="ch sp"> </span>' : `<span class="ch ${o.chCls || ''}">${c}</span>`).join('');
    o.cels = [...el.querySelectorAll('.ch')];
  } else el.innerHTML = o.html || '';
  if (o.style) el.style.cssText += ';' + o.style;
  (o.parent || cam).appendChild(el);
  o.el = el;
  if (o.canvas) { o.cv = el.querySelector('canvas'); o.cx = o.cv.getContext('2d'); }
  if (o.init) o.init(o);
  el.style.display = 'none'; o._v = false;
  clips.push(o);
  return o;
}
function cclip(o) { o.html = `<canvas width="${o.w}" height="${o.h}" style="display:block;width:${o.w}px;height:${o.h}px"></canvas>`; o.canvas = true; return clip(o); }
function applyClip(o, t) {
  const vis = t >= o.t0 - 1e-4 && t < o.t1 + o.dOut;
  if (!vis) { if (o._v) { o.el.style.display = 'none'; o._v = false; } return; }
  if (!o._v) { o.el.style.display = ''; o._v = true; }
  const s = base(o.x, o.y);
  if (!(o.words || o.chars) || o.wholeIn) mix(s, FXI[o.inFx](o.eIn(prog(t, o.t0, o.dIn))));
  if (t > o.t1) mix(s, FXO[o.outFx](o.eOut(prog(t, o.t1, o.dOut))));
  s.s *= 1 + o.drift * (t - o.t0);
  if (o.upd) o.upd(t, s, o);
  write(o.el, s, true);
  if (o.wels) o.wels.forEach((we, i) => {
    const d = o.wdata[i];
    const p = (o.wE || E.expo)(prog(t, d[1], o.wDur || .55));
    const ws = base(); mix(ws, FXI[d[3] || o.wFx || 'rise'](p));
    if (o.wupd) o.wupd(t, ws, i, o);
    write(we, ws, false);
  });
  if (o.cels) o.cels.forEach((ce, i) => {
    const p = (o.cE || E.expo)(prog(t, o.t0 + i * (o.stagger || .035), o.cDur || .7));
    const cs = base(); mix(cs, FXI[o.cFx || 'riseBig'](p));
    write(ce, cs, false);
  });
  if (o.draw) o.draw(t, o.cx, o);
}
// words helper: list of [text, si, key, cls, fx]
const WS = (si, list) => list.map(x => x === 'br' ? 'br' : [x[0], typeof x[1] === 'number' && x.length > 1 && x[1] > 30 ? x[1] : W(si, x[1]), x[2] || '', x[3]]);

// ---------------------------------------------------------------- svg bits
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.4 2.7-6 6-6s6 2.6 6 6"/><circle cx="17.2" cy="9" r="2.6"/><path d="M16 14.2c2.9.3 5 2.6 5 5.8"/></svg>',
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.8" width="16" height="18.4" rx="3"/><rect x="7.3" y="6" width="9.4" height="6.4" rx="1.4"/><path d="M7.5 15.6h9M7.5 18.2h5.4"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1" fill="#fff"/></svg>',
  plane: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M21.9 4.6 18.7 19.4c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.5 13.2 1.8 11.7c-1-.3-1-1 .2-1.5L20.5 3.1c.9-.3 1.6.2 1.4 1.5z"/></svg>',
  lens: '<svg viewBox="0 0 120 120" fill="none"><defs><radialGradient id="lg" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="rgba(255,255,255,.35)"/><stop offset="1" stop-color="rgba(120,180,255,.05)"/></radialGradient></defs><circle cx="50" cy="50" r="36" fill="url(#lg)" stroke="#fff" stroke-width="7"/><path d="M77 77l30 30" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>',
};
function candle(id, vivid) {
  const jar = vivid ? `url(#jar${id})` : '#5a6272', fl = vivid ? `url(#fl${id})` : '#7b8394', lab = vivid ? 'rgba(255,255,255,.92)' : '#8a92a3';
  return `<svg viewBox="0 0 200 220"><defs>
  <linearGradient id="jar${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1dc"/><stop offset=".55" stop-color="#ffb07a"/><stop offset="1" stop-color="#ff6a6a"/></linearGradient>
  <radialGradient id="fl${id}" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff7c2"/><stop offset=".5" stop-color="#ffb43d"/><stop offset="1" stop-color="#ff5a3d"/></radialGradient></defs>
  <ellipse cx="100" cy="204" rx="70" ry="9" fill="rgba(0,0,0,.22)"/>
  <rect x="44" y="80" width="112" height="122" rx="24" fill="${jar}"/>
  <rect x="44" y="80" width="112" height="20" rx="10" fill="rgba(255,255,255,.35)"/>
  <rect x="60" y="122" width="80" height="48" rx="10" fill="${lab}"/>
  <rect x="72" y="136" width="56" height="7" rx="3.5" fill="${vivid ? '#ff7a6a' : '#6b7383'}"/>
  <rect x="80" y="149" width="40" height="6" rx="3" fill="${vivid ? '#ffb39a' : '#6b7383'}"/>
  <path d="M100 80V62" stroke="#2b2b33" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M100 14C118 38 120 52 100 64C80 52 82 38 100 14Z" fill="${fl}"/>
  ${vivid ? '<circle cx="100" cy="46" r="40" fill="rgba(255,190,90,.25)"/>' : ''}
</svg>`;
}
const cardHTML = (id, kind) => `<div class="card glass ${kind}"><div class="ph">${candle(id, kind === 'vivid')}${kind === 'vivid' ? '<div class="badge">NEW</div>' : ''}</div><div class="t1"></div><div class="t2"></div><div class="row"><div class="price">149 zł</div><div class="buy">В корзину</div></div></div>`;

// ---------------------------------------------------------------- palette (background mood)
const PAL = [
  [0, ['#2b5cff', '#8a3cff', '#00c2ff'], .9],
  [ST(1) - .2, ['#3a4f80', '#6b2c4a', '#1e2c4f'], .75],
  [ST(3) - .1, ['#4a1020', '#200a14', '#1a0d1a'], .55],
  [ST(4) - .2, ['#1d3a8a', '#2563eb', '#0e1a3a'], .8],
  [ST(7) - .2, ['#06b6d4', '#2563eb', '#4338ca'], .85],
  [ST(8) - .1, ['#10142a', '#0a0d1d', '#120a20'], .4],
  [ST(9) - .05, ['#ff7a18', '#ff3d77', '#7a5cff'], 1.1],
  [ST(10) - .1, ['#ff3d77', '#7a5cff', '#2ec5ff'], 1],
  [ST(12) - .1, ['#7a5cff', '#ff7a18', '#ff3d77'], .95],
  [ST(13) - .1, ['#00e5ff', '#7a5cff', '#ff3df2'], 1.05],
  [ST(14) - .2, ['#2b3a67', '#4b3f8f', '#1c2541'], .7],
  [ST(16) - .3, ['#229ED9', '#2AABEE', '#5b5bff'], .9],
  [ST(19) - .05, ['#ff7a18', '#ff3d77', '#7a5cff'], 1.15],
  [VEND + .9, ['#2AABEE', '#7a5cff', '#ff3d77'], .9],

// ================================================================= BACKGROUND
const bg = document.getElementById('bg'), bx = bg.getContext('2d');
const fx = document.getElementById('fx'), fxx = fx.getContext('2d');
const flash = document.getElementById('flash');
const WD = 1080, HT = 1920;
// particles
const PR = rng(1234), PN = 520, ZMAX = 4200, FOC = 900;
const parts = []; for (let i = 0; i < PN; i++) parts.push({ x: (PR() - .5) * 3600, y: (PR() - .5) * 6200, z0: PR() * ZMAX, c: PR(), r: .6 + PR() * 1.4 });
const warps = EV.filter(e => e.type === 'warp'), impacts = EV.filter(e => e.type === 'impact');
function speed(t) {
  let v = 260;
  for (const w of warps) { const u = t - w.t; v += w.k * 5200 * (u < 0 ? Math.exp(-u * u / (2 * .07 * .07)) : Math.exp(-u / .38)); }
  return v;
}
const DT = 1 / 240, DN = Math.ceil((END + 1) / DT) + 2, Dc = new Float64Array(DN);
for (let i = 1; i < DN; i++) Dc[i] = Dc[i - 1] + speed(i * DT) * DT;
const Dist = t => { const f = clamp(t / DT, 0, DN - 2), i = Math.floor(f); return lerp(Dc[i], Dc[i + 1], f - i); };

function drawBG(t) {
  const pal = palAt(t);
  bx.globalCompositeOperation = 'source-over';
  bx.fillStyle = '#000'; bx.fillRect(0, 0, WD, HT);
  bx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 3; k++) {
    const x = WD / 2 + Math.sin(t * .23 + k * 2.1) * 420, y = HT / 2 + Math.cos(t * .17 + k * 1.7) * 700, r = 820 + Math.sin(t * .3 + k) * 120;
    const g = bx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(pal.c[k], .34 * pal.k)); g.addColorStop(.5, rgba(pal.c[k], .12 * pal.k)); g.addColorStop(1, rgba(pal.c[k], 0));
    bx.fillStyle = g; bx.fillRect(0, 0, WD, HT);
  }
  // impact glow
  let fl = 0; for (const im of impacts) { const u = t - im.t; if (u >= 0 && u < 1.5) fl += im.k * Math.exp(-u * 4); }
  if (fl > .01) { const g = bx.createRadialGradient(WD / 2, HT / 2, 0, WD / 2, HT / 2, 1100); g.addColorStop(0, rgba(pal.c[1], Math.min(.6, fl * .35))); g.addColorStop(1, rgba(pal.c[1], 0)); bx.fillStyle = g; bx.fillRect(0, 0, WD, HT); }
  // particles
  const D = Dist(t), v = speed(t), streak = Math.min(1600, v * .055);
  for (const p of parts) {
    const z = ((p.z0 - D) % ZMAX + ZMAX) % ZMAX + 40;
    const sx = WD / 2 + p.x * FOC / z, sy = HT / 2 + p.y * FOC / z;
    if (sx < -50 || sx > WD + 50 || sy < -50 || sy > HT + 50) continue;
    const a = clamp((ZMAX - z) / 1200) * clamp(z / 200) * .9;
    const col = p.c < .5 ? pal.c[0] : (p.c < .8 ? [255, 255, 255] : pal.c[2]);
    const cc = mixc(col, [255, 255, 255], .45);
    if (streak > 30) {
      const z2 = z + streak, sx2 = WD / 2 + p.x * FOC / z2, sy2 = HT / 2 + p.y * FOC / z2;
      bx.strokeStyle = rgba(cc, a); bx.lineWidth = p.r * FOC / z * 1.2; bx.beginPath(); bx.moveTo(sx2, sy2); bx.lineTo(sx, sy); bx.stroke();
    } else { bx.fillStyle = rgba(cc, a); bx.beginPath(); bx.arc(sx, sy, Math.max(.6, p.r * FOC / z * 1.1), 0, 7); bx.fill(); }
  }
  bx.globalCompositeOperation = 'source-over';
}
function drawFX(t) {
  fxx.clearRect(0, 0, WD, HT);
  let fl = 0;
  for (const im of impacts) {
    const u = t - im.t; if (u < 0 || u > 1.2) continue;
    fl += im.k * Math.exp(-u * 10);
    const r = E.out3(clamp(u / .9)) * 1500 * (.6 + im.k * .4), a = (1 - clamp(u / .9)) * .55 * Math.min(1, im.k);
    fxx.strokeStyle = `rgba(255,255,255,${a})`; fxx.lineWidth = 6 + 30 * (1 - clamp(u / .9));
    fxx.beginPath(); fxx.arc(WD / 2, HT / 2, r, 0, 7); fxx.stroke();
  }
  flash.style.opacity = clamp(fl * .45, 0, .85).toFixed(3);
  // camera shake
  let sx = 0, sy = 0, rot = 0;
  for (const im of impacts) { const u = t - im.t; if (u < 0 || u > .8) continue; const a = im.k * 22 * Math.exp(-u * 7); sx += Math.sin(u * 83 + im.t) * a; sy += Math.cos(u * 71 + im.t * 2) * a; rot += Math.sin(u * 53) * a * .02; }
  cam.style.transform = `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${rot.toFixed(3)}deg)`;
}
// grain
const gr = document.getElementById('grain'), gx = gr.getContext('2d');
const grains = []; { const R = rng(99); for (let k = 0; k < 6; k++) { const id = gx.createImageData(540, 960); for (let i = 0; i < id.data.length; i += 4) { const v = R() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } grains.push(id); } }

window.renderFrame = function (t) {
  drawBG(t);
  for (const o of clips) applyClip(o, t);
  drawFX(t);
  gx.putImageData(grains[Math.floor(t * 30) % grains.length], 0, 0);
};
window.SFX = EV.slice().sort((a, b) => a.t - b.t);
window.READY = true;
})();
