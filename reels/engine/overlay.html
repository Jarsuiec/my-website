<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/unbounded/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/unbounded/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/unbounded/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/manrope/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/manrope/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/700.css">
<style>
  :root {
    --bg:#060607; --lime:#c6ff3d; --hot:#ff5a36; --ice:#5fd4ff; --txt:#f4f4ef; --mute:rgba(244,244,239,.38);
    --display:"Unbounded","Noto Color Emoji",sans-serif; --body:"Manrope","Noto Color Emoji",sans-serif; --mono:"JetBrains Mono",monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  body.opaque { background:var(--bg); }
  body { font-family:var(--body); color:var(--txt); }
  .abs { position:absolute; }
  .fill { position:absolute; inset:0; }

  /* ---------- background ---------- */
  #bg { background:radial-gradient(1200px 900px at 50% 62%, #121509 0%, var(--bg) 60%); }
  body:not(.opaque) #bg { display:none; }
  #dots { inset:-60px; background-image:radial-gradient(rgba(198,255,61,.13) 1.6px, transparent 1.8px); background-size:44px 44px; }
  #glow { left:140px; top:620px; width:800px; height:800px; border-radius:50%; filter:blur(90px); opacity:.16; }
  #bios { left:40px; right:40px; top:0; height:4000px; font-family:var(--mono); font-size:19px; line-height:30px;
    color:rgba(198,255,61,.05); white-space:pre; overflow:hidden; }
  #shadeTop { left:0; right:0; top:0; height:720px; background:linear-gradient(rgba(0,0,0,.6),transparent); }
  #vignette { background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.78) 100%); }
  #grain { left:0; top:0; width:1080px; height:1920px; opacity:.07; mix-blend-mode:screen; image-rendering:pixelated; }

  /* ---------- HUD ---------- */
  .bracket { width:54px; height:54px; border:0 solid rgba(198,255,61,.6); }
  .hudtxt { font-family:var(--mono); font-size:19px; letter-spacing:2.5px; color:var(--mute); text-transform:uppercase; }
  #brand { left:76px; top:96px; display:flex; align-items:center; gap:14px; font-family:var(--mono); font-weight:700;
    font-size:22px; letter-spacing:4px; color:var(--txt); }
  #brand .dot { width:12px; height:12px; border-radius:50%; background:var(--hot); box-shadow:0 0 14px var(--hot); }
  #temp { right:76px; top:84px; width:300px; height:118px; border:1.5px solid rgba(244,244,239,.14); border-radius:16px;
    background:rgba(10,11,8,.55); padding:14px 18px; }
  #temp .lbl { font-family:var(--mono); font-size:16px; letter-spacing:3px; color:var(--mute); }
  #temp .val { font-family:var(--display); font-weight:800; font-size:40px; line-height:1.05; margin-top:6px; }
  #temp svg { position:absolute; right:16px; bottom:22px; }
  #ruler { right:34px; top:300px; width:30px; height:760px; overflow:visible; }
  #meter { left:76px; bottom:96px; display:flex; align-items:center; gap:5px; height:60px; }
  #meter i { display:block; width:6px; border-radius:3px; background:var(--lime); }
  #tc { right:76px; bottom:100px; text-align:right; line-height:1.6; }

  /* ---------- caption (spoken words) ---------- */
  #caption { left:64px; right:64px; top:250px; height:420px; }
  .cap { text-align:center; font-family:var(--display); font-weight:800; text-transform:uppercase; font-size:62px; line-height:1.3;
    letter-spacing:-.5px; text-shadow:0 4px 30px rgba(0,0,0,.7); }
  .cap .w { display:inline-block; margin:0 .12em; }
  .hl { position:relative; display:inline-block; padding:0 .16em; color:#0b0c08; z-index:0; text-shadow:none; }
  .hl::before { content:""; position:absolute; inset:.04em -.02em 0; border-radius:.12em; z-index:-1;
    background:var(--c); box-shadow:0 0 34px var(--g); transform:scaleX(var(--k,1)); transform-origin:left; }
  .hl.lime { --c:#c6ff3d; --g:rgba(198,255,61,.55); } .hl.hot { --c:#ff5a36; --g:rgba(255,90,54,.55); color:#fff; } .hl.ice { --c:#5fd4ff; --g:rgba(95,212,255,.55); }
  .hl .brk { position:absolute; width:16px; height:16px; border:3px solid var(--c); opacity:var(--b,0); }
  .hl .b1 { left:-14px; top:-10px; border-right:0; border-bottom:0; } .hl .b2 { right:-14px; bottom:-10px; border-left:0; border-top:0; }

  /* ---------- visual area ---------- */
  #stage3d { left:0; top:730px; width:1080px; height:700px; perspective:1400px; }
  .vis { position:absolute; inset:0; transform-style:preserve-3d; }
  .art { position:absolute; left:50px; top:20px; width:980px; height:653px; overflow:visible; }
  .callout { font-family:"JetBrains Mono"; font-weight:700; font-size:21px; letter-spacing:2px; fill:#f4f4ef; }

  #big { left:0; right:0; top:950px; text-align:center; font-family:var(--display); font-weight:900; font-size:200px; letter-spacing:-6px;
    line-height:1; opacity:0; white-space:nowrap; }
  #scan { left:0; right:0; height:4px; background:var(--lime); box-shadow:0 0 30px 6px rgba(198,255,61,.6); opacity:0; }
  #flash { background:#fff; opacity:0; mix-blend-mode:overlay; }
  #progress { left:0; top:0; height:6px; background:linear-gradient(90deg,var(--lime),#efffb5); box-shadow:0 0 18px var(--lime); }

  /* ---------- cards & widgets ---------- */
  .card { position:absolute; left:80px; right:80px; top:10px; border-radius:44px; padding:50px 46px 46px; text-align:center;
    background:linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border:2px solid rgba(198,255,61,.55);
    box-shadow:0 40px 120px rgba(0,0,0,.6), 0 0 90px rgba(198,255,61,.15); }
  .card .handle { font-family:var(--display); font-weight:900; font-size:80px; letter-spacing:-2px; color:var(--txt); margin-top:18px; }
  .card .link { font-family:var(--mono); font-weight:700; font-size:40px; color:var(--lime); margin-top:24px; }
  .chips { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-top:30px; }
  .chip { font-family:var(--display); font-weight:800; font-size:32px; padding:14px 26px; border-radius:999px; text-transform:uppercase; }
  .chip.on { background:var(--lime); color:#0b0c08; box-shadow:0 0 30px rgba(198,255,61,.4); }
  .chip.line { border:2.5px solid rgba(244,244,239,.4); color:var(--txt); }
  .btn { display:inline-flex; align-items:center; gap:20px; margin-top:36px; padding:24px 54px; border-radius:999px; background:var(--lime);
    color:#0b0c08; font-family:var(--display); font-weight:900; font-size:42px; text-transform:uppercase; box-shadow:0 0 60px rgba(198,255,61,.5); }
  .list .row { display:flex; align-items:center; gap:28px; margin:0 auto 22px; width:820px; padding:22px 34px; border-radius:26px;
    background:rgba(255,255,255,.04); border:1.5px solid rgba(244,244,239,.12); font-family:var(--display); font-weight:800; font-size:46px; text-transform:uppercase; }
  .list .row b { font-family:var(--mono); font-size:26px; color:var(--lime); font-weight:700; }
</style>
</head>
<body>
<div class="fill" id="world">
  <div class="fill" id="bg"><div class="abs" id="dots"></div><div class="abs" id="glow"></div><div class="abs" id="bios"></div></div>
  <div class="abs" id="shadeTop"></div>
  <div class="abs" id="stage3d"></div>
  <div class="abs" id="caption"></div>
  <div class="abs" id="big"></div>
</div>

<!-- HUD -->
<div class="abs bracket" style="left:36px;top:36px;border-left-width:3px;border-top-width:3px"></div>
<div class="abs bracket" style="right:36px;top:36px;border-right-width:3px;border-top-width:3px"></div>
<div class="abs bracket" style="left:36px;bottom:36px;border-left-width:3px;border-bottom-width:3px"></div>
<div class="abs bracket" style="right:36px;bottom:36px;border-right-width:3px;border-bottom-width:3px"></div>
<div class="abs" id="brand"><span class="dot"></span><span id="brandText"></span></div>
<div class="abs hudtxt" style="left:102px;top:134px" id="sub1"></div>
<div class="abs" id="temp"><div class="lbl">CPU TEMP</div><div class="val" id="tempVal">--</div>
  <svg width="96" height="44" viewBox="0 0 104 44"><polyline id="spark" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
<svg class="abs" id="ruler" viewBox="0 0 30 760"></svg>
<div class="abs" id="meter"></div>
<div class="abs hudtxt" style="left:76px;bottom:166px">VOICE · REC</div>
<div class="abs hudtxt" id="tc"></div>
<div class="fill" id="vignette"></div>
<canvas class="abs" id="grain" width="270" height="480"></canvas>
<div class="abs" id="scan"></div>
<div class="fill" id="flash"></div>
<div class="abs" id="progress"></div>

<script src="art.js"></script>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeIn = x => x * x * x;
const backOut = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const rnd = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/zł/g, '<span style="text-transform:none">zł</span>');
const lerp = (a, b, k) => a + (b - a) * k;
const mixHex = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
const TONE = { lime: '#c6ff3d', hot: '#ff5a36', ice: '#5fd4ff' };

// caption markup: [lime] {hot} <ice> keywords; trailing punctuation stays attached
function parseCaption(text) {
  const re = /(\[[^\]]+\]|\{[^}]+\}|<[^>]+>)(\S*)|(\S+)/g, out = [];
  let m;
  while ((m = re.exec(text))) {
    if (m[3]) { out.push({ html: esc(m[3]), len: m[3].length }); continue; }
    const kind = m[1][0] === '[' ? 'lime' : m[1][0] === '{' ? 'hot' : 'ice', word = m[1].slice(1, -1);
    out.push({ html: `<span class="hl ${kind}"><i class="brk b1"></i><i class="brk b2"></i>${esc(word)}</span>${esc(m[2])}`, len: word.length + m[2].length });
  }
  return out;
}

const ART_DEFS = `<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
const TG = `<svg width="124" height="124" viewBox="0 0 240 240"><circle cx="120" cy="120" r="104" fill="#c6ff3d"/>
  <path d="M60 117l112-44c6-2 11 2 9 10l-19 90c-1 7-6 8-12 5l-30-22-14 14c-2 2-3 3-7 3l2-31 57-51c3-2-1-4-4-2l-70 44-30-9c-7-2-7-7 1-10z" fill="#0b0c08"/></svg>`;

// ---------- centre visuals ----------
const VIS = {
  art: {
    build: s => { const A = window.ART[s.art];
      return `<svg class="art" viewBox="0 0 900 600">${ART_DEFS}${A.build()}<g>${(A.labels || []).map(l => { const c = TONE[l.tone || 'lime'];
        return `<g class="co"><circle cx="${l.x}" cy="${l.y}" r="0" fill="${c}"/>
        <polyline points="${l.x},${l.y} ${l.x + l.dx * .45},${l.y + l.dy} ${l.x + l.dx},${l.y + l.dy}" fill="none" stroke="${c}" stroke-width="2.5" stroke-dasharray="500" stroke-dashoffset="500"/>
        <text class="callout" x="${l.x + l.dx + (l.dx > 0 ? 12 : -12)}" y="${l.y + l.dy + 8}" text-anchor="${l.dx > 0 ? 'start' : 'end'}" opacity="0">${esc(l.text)}</text></g>`; }).join('')}</g></svg>`; },
    update(el, lt, dur, s) {
      const A = window.ART[s.art];
      A.update(el.querySelector('svg'), lt, dur);
      el.querySelectorAll('.co').forEach((g, i) => {
        const a = A.labels[i].at ?? .6;
        g.children[0].setAttribute('r', 7 * backOut(prog(lt, a, a + .25)));
        g.children[1].setAttribute('stroke-dashoffset', 500 * (1 - easeOut(prog(lt, a + .1, a + .45))));
        g.children[2].setAttribute('opacity', easeOut(prog(lt, a + .35, a + .6)));
      });
    },
  },
  card: {
    build: s => `<div class="card">${s.telegram ? TG : ''}
      ${s.telegram ? `<div class="handle">${esc(s.telegram)}</div>` : ''}${s.link ? `<div class="link">${esc(s.link)}</div>` : ''}
      <div class="chips">${(s.chips || []).map((c, i) => `<span class="chip ${i ? 'line' : 'on'}">${esc(c)}</span>`).join('')}</div>
      ${s.button ? `<div class="btn">${esc(s.button)} <span style="font-size:50px">→</span></div>` : ''}</div>`,
    update(el, lt) {
      const card = el.querySelector('.card'), p = backOut(prog(lt, .1, .6));
      card.style.opacity = clamp(p * 2);
      card.style.transform = `translateY(${(1 - p) * 160}px) rotateX(${(1 - p) * 25}deg)`;
      el.querySelectorAll('.chip').forEach((c, i) => {
        const q = backOut(prog(lt, .6 + i * .14, .9 + i * .14)); c.style.transform = `scale(${q})`; c.style.opacity = clamp(q * 2);
      });
      const b = el.querySelector('.btn');
      if (b) { const q = backOut(prog(lt, 1.0, 1.3)); b.style.opacity = clamp(q * 2);
        b.style.transform = `scale(${q * (1 + Math.sin(Math.max(0, lt - 1.3) * 6) * .035)})`; }
    },
  },
  timer: {
    build: s => { const c = TONE[s.tone || 'lime'];
      return `<svg class="art" viewBox="0 0 900 600">${ART_DEFS}<g filter="url(#glow)"><circle cx="450" cy="300" r="230" fill="rgba(10,11,8,.8)" stroke="#23271b" stroke-width="18"/>
        <circle class="arc" cx="450" cy="300" r="230" fill="none" stroke="${c}" stroke-width="18" stroke-linecap="round" transform="rotate(-90 450 300)" stroke-dasharray="1445" stroke-dashoffset="1445"/></g>
        <text class="num" x="450" y="335" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="130" fill="${c}">${s.seconds == null ? '??' : '0'}</text>
        <text x="450" y="405" text-anchor="middle" font-family="JetBrains Mono" font-size="30" letter-spacing="6" fill="rgba(244,244,239,.5)">${s.seconds == null ? 'ВПИШИ ВРЕМЯ' : 'СЕКУНД'}</text></svg>`; },
    update(el, lt, dur, s) {
      if (s.seconds == null) return;
      const k = easeOut(prog(lt, .3, dur - .4));
      el.querySelector('.num').textContent = (s.seconds * k).toFixed(s.seconds < 100 ? 1 : 0);
      el.querySelector('.arc').setAttribute('stroke-dashoffset', 1445 * (1 - k));
    },
  },
  list: {
    build: s => `<div class="list" style="padding-top:20px">${s.items.map((it, i) => `<div class="row"><b>0${i + 1}</b>${esc(it)}</div>`).join('')}</div>`,
    update(el, lt, dur) {
      const rows = el.querySelectorAll('.row'), step = (dur - .6) / rows.length;
      rows.forEach((r, i) => { const p = backOut(prog(lt, .1 + i * step, .4 + i * step));
        r.style.opacity = clamp(p * 2); r.style.transform = `translateX(${(1 - p) * 260}px)`; });
    },
  },
};

// ---------- setup ----------
let SC = [], TOTAL = 0, LEVELS = [], LEVEL_FPS = 60;
window.setup = function (cfg, opts = {}) {
  LEVELS = opts.levels || []; LEVEL_FPS = opts.levelFps || 60;
  if (opts.opaque) document.body.classList.add('opaque');
  $('brandText').textContent = cfg.brand || '';
  $('sub1').textContent = cfg.tagline || '';
  TOTAL = cfg.scenes.at(-1).t[1];

  const lines = [];
  for (let i = 0; i < 130; i++) {
    const r = k => rnd(i * 7 + k);
    lines.push([`CPU0 ${(40 + r(1) * 55).toFixed(1)}°C`, `FAN1 ${Math.round(1200 + r(2) * 3800)} RPM`, `VCORE ${(0.9 + r(3) * .4).toFixed(3)}V`,
      `0x${Math.floor(r(4) * 0xffffff).toString(16).padStart(6, '0').toUpperCase()}`, `SMART ${r(5) > .2 ? 'OK ' : 'ERR'}`, `MEM ${Math.round(r(6) * 100)}%`].join('    '));
  }
  $('bios').textContent = lines.join('\n');

  let ticks = '';
  for (let s = 0; s <= TOTAL; s += 1) { const y = 760 * s / TOTAL;
    ticks += `<line x1="${s % 5 ? 18 : 8}" x2="30" y1="${y}" y2="${y}" stroke="rgba(244,244,239,${s % 5 ? .18 : .4})" stroke-width="2"/>`; }
  cfg.scenes.forEach(s => { ticks += `<rect x="0" y="${760 * s.t[0] / TOTAL - 1}" width="30" height="3" fill="rgba(198,255,61,.55)"/>`; });
  $('ruler').innerHTML = ticks + `<polygon id="rulerMark" points="-6,-10 10,0 -6,10" fill="#c6ff3d"/>`;
  $('meter').innerHTML = Array.from({ length: 22 }, () => '<i></i>').join('');

  let stage = '', caps = '';
  SC = cfg.scenes.map((s, i) => {
    const hasClip = opts.clipsPresent && opts.clipsPresent[i];
    const kind = s.type === 'cta' ? 'card' : s.type === 'timer' ? 'timer' : s.type === 'list' ? 'list'
      : (!hasClip && s.art && window.ART[s.art]) ? 'art' : null;
    if (kind) stage += `<div class="vis" id="vis${i}" style="opacity:0">${VIS[kind].build(s)}</div>`;
    const words = parseCaption(s.caption || s.voice || s.text || '');
    caps += `<div class="fill" id="cap${i}" style="display:flex;align-items:center;justify-content:center;opacity:0">
      <div class="cap">${words.map(w => `<span class="w">${w.html}</span>`).join(' ')}</div></div>`;
    const at = s.voiceAt ?? .15, vd = s.voiceDur ?? (s.t[1] - s.t[0]) * .85, tot = words.reduce((a, w) => a + w.len + 1, 0);
    let acc = 0;
    words.forEach(w => { w.start = at + vd * .95 * acc / tot; acc += w.len + 1; });
    return { s, i, kind, words };
  });
  $('stage3d').innerHTML = stage;
  $('caption').innerHTML = caps;
  SC.forEach(sc => {
    sc.vis = $('vis' + sc.i); sc.cap = $('cap' + sc.i);
    sc.wordEls = [...sc.cap.querySelectorAll('.w')];
    const capEl = sc.cap.firstElementChild;
    for (let fs = 62; fs >= 44 && capEl.offsetHeight > 410; fs -= 4) capEl.style.fontSize = fs + 'px';
  });
  window.TOTAL = TOTAL;
};

// temperature story: scenes set "temp"; HUD glides between values
function tempAt(t) {
  let prev = null;
  for (const { s } of SC) {
    if (s.temp == null) continue;
    if (t < s.t[0]) return prev == null ? s.temp : lerp(prev.v, s.temp, easeInOut(prog(t, s.t[0] - .4, s.t[0] + 1.2)));
    prev = { v: s.temp };
  }
  return prev ? prev.v : null;
}
const tempColor = v => v > 75 ? mixHex('#ffd23d', '#ff5a36', prog(v, 75, 90)) : v > 60 ? mixHex('#c6ff3d', '#ffd23d', prog(v, 60, 75)) : mixHex('#5fd4ff', '#c6ff3d', prog(v, 45, 60));
const level = t => LEVELS.length ? (LEVELS[Math.min(LEVELS.length - 1, Math.max(0, Math.floor(t * LEVEL_FPS)))] || 0) : 0;
const grainCtx = $('grain').getContext('2d'), grainImg = grainCtx.createImageData(270, 480);

window.render = function (t) {
  const frame = Math.round(t * 60);
  let shakeX = 0, shakeY = 0, flash = 0, scan = -1, bigOn = false;

  SC.forEach(sc => {
    const { s, kind } = sc, [a, b] = s.t, dur = b - a, lt = t - a, last = b >= TOTAL;
    const vis = t >= a && (t < b || last);
    const inK = easeOut(prog(lt, 0, .32)), outK = last ? 0 : easeIn(prog(lt, dur - .2, dur));
    const blur = (1 - inK) * 16 + outK * 18, zoom = lerp(.93, 1, inK) + outK * .07;
    const B = s.big, bAt = B ? (B.at ?? .5) : 0, bHold = B ? (B.hold ?? 1) : 0;

    if (B) {
      const l2 = lt - bAt, k = 1 - prog(l2, 0, .45);
      if (l2 >= 0 && k > 0) { shakeX += Math.sin(l2 * 30) * 9 * k * k; shakeY += Math.cos(l2 * 24) * 7 * k * k; } // smooth, so motion blur doesn't ghost
      if (l2 >= 0) flash = Math.max(flash, Math.max(0, 1 - l2 * 5));
    }
    if (a > 0 && lt > -.05 && lt < .35) scan = prog(lt, -.05, .35);
    if (a > 0) flash = Math.max(flash, Math.max(0, 1 - Math.abs(lt) * 10) * .45);

    // caption
    sc.cap.style.opacity = vis ? 1 - outK : 0;
    sc.cap.style.filter = vis && blur > .3 ? `blur(${blur * .6}px)` : 'none';
    sc.cap.style.transform = `scale(${zoom})`;
    if (vis) sc.wordEls.forEach((el, j) => {
      const w = sc.words[j], p = prog(lt, w.start - .05, w.start + .2), e = easeOut(p);
      el.style.opacity = e;
      el.style.transform = `translateY(${(1 - e) * 46}px) scale(${lerp(.8, 1, backOut(p))})`;
      el.style.filter = p > 0 && p < 1 ? `blur(${(1 - e) * 10}px)` : 'none';
      const hl = el.firstElementChild && el.firstElementChild.classList.contains('hl') ? el.firstElementChild : null;
      if (hl) { hl.style.setProperty('--k', easeOut(prog(lt, w.start, w.start + .25)));
        hl.style.setProperty('--b', Math.max(0, 1 - Math.abs(lt - w.start - .35) * 2.2)); }
    });

    // centre visual
    if (sc.vis) {
      const dim = B ? 1 - .78 * (prog(lt, bAt - .05, bAt + .1) - prog(lt, bAt + bHold, bAt + bHold + .3)) : 1;
      sc.vis.style.opacity = vis ? (1 - outK) * dim : 0;
      const rx = Math.sin(t * .7 + sc.i) * 3, ry = Math.cos(t * .5 + sc.i) * 6, z = lerp(1, 1.05, prog(lt, 0, dur));
      sc.vis.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) scale(${zoom * z})`;
      const vb = blur + (1 - dim) * 10;
      sc.vis.style.filter = vis && vb > .3 ? `blur(${vb}px)` : 'none';
      if (vis) VIS[kind].update(sc.vis, lt, dur, s);
    }

    // big slam word
    if (B && vis) {
      const l2 = lt - bAt;
      if (l2 >= 0 && l2 < bHold + .3) {
        bigOn = true;
        const big = $('big'), p = backOut(prog(l2, 0, .32)), o = easeIn(prog(l2, bHold, bHold + .28)), c = TONE[B.tone || 'lime'];
        if (big.dataset.for !== String(sc.i)) { big.innerHTML = esc(B.text); big.dataset.for = sc.i; }
        big.style.color = c;
        big.style.textShadow = `0 0 40px ${c}, 0 0 130px ${c}, 0 12px 0 rgba(0,0,0,.4)`;
        big.style.opacity = clamp(p * 1.5) * (1 - o);
        big.style.transform = `scale(${lerp(2.4, 1, p) * (1 - o * .15) + Math.max(0, l2 - .32) * .03}) rotate(${(1 - p) * -6}deg)`;
        big.style.filter = p < 1 || o > 0 ? `blur(${(1 - p) * 14 + o * 10}px)` : 'none';
      }
    }
  });
  if (!bigOn) $('big').style.opacity = 0;
  $('world').style.transform = `translate(${shakeX}px,${shakeY}px)`;
  $('dots').style.transform = `translate(${(t * 9) % 44}px,${(t * 14) % 44}px)`;
  $('bios').style.transform = `translateY(${-(t * 22)}px)`;
  $('scan').style.opacity = scan >= 0 ? Math.sin(scan * Math.PI) : 0;
  $('scan').style.top = `${lerp(160, 1700, easeInOut(Math.max(0, scan)))}px`;
  $('flash').style.opacity = flash * .55;

  // HUD
  const tv = tempAt(t);
  if (tv != null) {
    const col = tempColor(tv);
    $('tempVal').textContent = `${Math.round(tv)}°C`; $('tempVal').style.color = col;
    let pts = '';
    for (let k = 0; k <= 26; k++) { const v = tempAt(Math.max(0, t - 6 + k * 6 / 26)) + Math.sin(k * 1.7 + t * 3) * 1.2;
      pts += `${k * 4},${42 - clamp((v - 35) / 65) * 38} `; }
    $('spark').setAttribute('points', pts); $('spark').setAttribute('stroke', col);
    $('glow').style.background = col;
  } else $('temp').style.display = 'none';
  const lv = level(t);
  [...$('meter').children].forEach((bar, k) => {
    const v = clamp(lv * (.55 + .45 * Math.sin(k * 1.9 + t * 17) ** 2) * (1 - Math.abs(k - 10.5) / 16));
    bar.style.height = `${6 + v * 54}px`; bar.style.opacity = .3 + v * .7;
  });
  $('rulerMark').setAttribute('transform', `translate(0 ${760 * t / TOTAL})`);
  const cur = SC.findIndex(({ s }) => t >= s.t[0] && t < s.t[1]);
  $('tc').innerHTML = `SCENE ${String((cur < 0 ? SC.length - 1 : cur) + 1).padStart(2, '0')}/${String(SC.length).padStart(2, '0')}<br>${t.toFixed(2).padStart(5, '0')} / ${TOTAL.toFixed(2)}`;
  $('progress').style.width = `${t / TOTAL * 1080}px`;

  const d = grainImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = rnd(i * .13 + frame * 77.7) * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  grainCtx.putImageData(grainImg, 0, 0);
};
</script>
