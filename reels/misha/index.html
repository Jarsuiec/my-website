<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/@fontsource/unbounded/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/unbounded/900.css">
<link rel="stylesheet" href="/node_modules/@fontsource/manrope/800.css">
<link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/700.css">
<style>
  :root { --y:#ffe11a; --c:#ff5a4e; --b:#2b4bff; --m:#1fe0a8; --p:#ff7ad9; --s:#7fd3ff; --k:#111; --w:#fff;
    --d:"Unbounded","Noto Color Emoji",sans-serif; --t:"Manrope","Noto Color Emoji",sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--y); font-family:var(--t); color:var(--k); }
  .fill { position:absolute; inset:0; } .abs { position:absolute; }
  #frame { position:absolute; inset:0; overflow:hidden; }
  .scene { position:absolute; inset:0; opacity:0; overflow:hidden; }
  .dots { position:absolute; inset:-40px; background-image:radial-gradient(rgba(17,17,17,.13) 3.2px, transparent 3.6px); background-size:30px 30px; }
  .rays { position:absolute; left:50%; top:40%; width:3200px; height:3200px; margin:-1600px 0 0 -1600px;
    background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.13) 0deg 9deg, transparent 9deg 18deg); }
  .stripes { position:absolute; inset:-200px; background:repeating-linear-gradient(-28deg, transparent 0 60px, rgba(43,75,255,.12) 60px 120px); }

  /* stickers */
  .stk { display:inline-flex; align-items:center; gap:22px; font-family:var(--d); font-weight:900; text-transform:uppercase;
    border:7px solid var(--k); border-radius:30px; box-shadow:12px 12px 0 var(--k); padding:18px 34px; line-height:1.02; white-space:nowrap; }
  .big { font-family:var(--d); font-weight:900; text-transform:uppercase; line-height:.95; letter-spacing:-.02em; }
  .outline { -webkit-text-stroke:10px var(--k); paint-order:stroke fill; }
  .shadow { text-shadow:10px 10px 0 var(--k); }
  .bubble { position:absolute; background:var(--w); border:7px solid var(--k); border-radius:44px; box-shadow:12px 12px 0 var(--k);
    font-family:var(--d); font-weight:900; text-transform:uppercase; padding:30px 40px; line-height:1.08; }
  .bubble::after { content:""; position:absolute; width:56px; height:56px; background:var(--w); border-right:7px solid var(--k); border-bottom:7px solid var(--k);
    transform:rotate(45deg); }
  .bubble.tail-b::after { left:90px; bottom:-34px; } .bubble.tail-l::after { left:-34px; top:60px; transform:rotate(135deg); }
  .avatar { position:absolute; border-radius:50%; overflow:hidden; border:16px solid var(--w); box-shadow:0 0 0 8px var(--k), 16px 16px 0 8px var(--k); }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

  /* phone (chunky cartoon) */
  .phone { position:absolute; width:600px; height:1060px; border-radius:80px; background:var(--k); padding:22px; box-shadow:16px 16px 0 rgba(17,17,17,.35); }
  .phone .scr { position:relative; width:100%; height:100%; border-radius:60px; overflow:hidden; background:#f4f1ea; }
  .phone .notch { position:absolute; left:50%; top:16px; width:150px; height:40px; margin-left:-75px; border-radius:20px; background:var(--k); z-index:5; }

  /* subtitles */
  #subs { position:absolute; left:50px; right:50px; top:1370px; height:240px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .cue { font-family:var(--d); font-weight:800; font-size:56px; line-height:1.24; color:var(--w); text-transform:uppercase;
    -webkit-text-stroke:10px var(--k); paint-order:stroke fill; filter:drop-shadow(6px 6px 0 var(--k)); }
  .cue .line { display:block; white-space:nowrap; } .cue .w { display:inline-block; margin:0 .1em; }
  .cue .yellow { color:var(--y); } .cue .red { color:#ff6b5e; } .cue .green { color:var(--m); }

  #flash { background:#fff; opacity:0; }
  #grain { position:absolute; left:0; top:0; width:1080px; height:1920px; opacity:.05; mix-blend-mode:multiply; image-rendering:pixelated; }
  #brand { position:absolute; left:50px; top:70px; display:flex; align-items:center; gap:14px; font-family:var(--d); font-weight:900; font-size:30px;
    background:var(--w); border:6px solid var(--k); border-radius:999px; padding:10px 26px 10px 12px; box-shadow:8px 8px 0 var(--k); }
  #brand i { width:36px; height:36px; border-radius:50%; background:var(--b); border:5px solid var(--k); display:block; }
</style>
</head>
<body>
  <div id="frame">
    <div id="scenes" class="fill"></div>
    <div id="brand"><i></i>SOFIUS GROUP</div>
    <div id="subs"></div>
    <canvas id="grain" width="270" height="480"></canvas>
    <div id="flash" class="fill"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
