[functions]
  directory = "netlify/functions"

# Исходники WorkControl AI лежат в репозитории, но не должны публиковаться на сайте.
[[redirects]]
  from = "/workcontrol-ai/*"
  to = "/404.html"
  status = 404
  force = true

# Проект рекламного ролика тоже не публикуется на сайте.
[[redirects]]
  from = "/pc-master-commercial/*"
  to = "/404.html"
  status = 404
  force = true
